// Simple Elytra Slot. One slot above the offhand for an elytra, which glides as if worn,
// so a chestplate and an elytra can be worn together. Universal jar: the slot and the glide
// run on the server, the slot's look, the wings on the back and the HUD icon on the client.
// Built on SlotKit (the slot) and MenuKit (the HUD); Inventory Plus is optional and only
// adds the mod's switch to its inventory column.
//
// Included from the root settings.gradle as `:simple-elytra-slot`. Build with
// `./gradlew :simple-elytra-slot:build` from the workspace root.

plugins {
    // The Loom plugin id is namespaced from 1.15 on. The version is pinned at the workspace root.
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'java'
    id 'com.modrinth.minotaur' version '2.+'
}

version = property('simpleelytraslot_version')
group   = property('maven_group')

base.archivesName = 'simple-elytra-slot'

java {
    // Minecraft 26.x runs on Java 25.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    // Not for this mod. Inventory Plus (compile-only, below) depends on Keybindery,
    // which depends on YACL, whose 26.x builds are only here.
    maven { url 'https://api.modrinth.com/maven' }
}

// MenuKit, SlotKit and Inventory Plus have separate main and client source sets. A
// project dependency sees only main, so their client halves are added by output, which
// needs them evaluated first. A published jar holds both halves.
evaluationDependsOn(':menukit')
evaluationDependsOn(':slotkit')
evaluationDependsOn(':inventory-plus')

dependencies {
    // 26.x is unobfuscated: no mappings line, and plain Java configurations.
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"
    implementation "net.fabricmc:fabric-loader:${property('loader_version')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}"

    implementation project(':menukit')
    implementation project(':slotkit')
}

loom {
    // src/main holds what a server loads (the slot, the glide); src/client holds the
    // slot's look, the wings on the back, the HUD icon and the Inventory Plus
    // integration. The compiler refuses a main class that reaches a client one.
    splitEnvironmentSourceSets()
    mods {
        simpleelytraslot {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client { ideConfigGenerated = false }
        server { ideConfigGenerated = false }
        // Test Gallery: boots straight into the generated test world in run/saves/TestGallery.
        // Generate it with `test-gallery/run-scene.sh simple-elytra-slot <scene>` (which also runs this).
        testGallery {
            inherit client
            name 'Test Gallery'
            programArgs '--quickPlaySingleplayer', 'TestGallery'
            ideConfigGenerated = false
        }
    }
}

// Client-only dependencies, after loom {} so its client configurations exist.
dependencies {
    clientImplementation rootProject.project(':menukit').sourceSets.client.output
    clientImplementation rootProject.project(':slotkit').sourceSets.client.output

    // Inventory Plus is optional ("suggests"). Its API is compiled against and never
    // bundled; only the `ip` package touches it, and only when IP is loaded.
    clientCompileOnly project(':inventory-plus')
    clientCompileOnly rootProject.project(':inventory-plus').sourceSets.client.output
}

// Self-checks: Fabric client gametests in src/gametest, run with
// `./gradlew :simple-elytra-slot:runClientGameTest`. The run opens its own window, runs every
// check and closes; it never touches run/ or a scene client. `-PwithTotem` loads Simple Totem
// Slot's built jar too (gametests and the scene client), for the shared column above the offhand.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'simpleelytraslot_checks'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}
apply from: rootProject.file('Trevlar Mods Codebases/test-gallery/kit/checks.gradle')   // SceneWorld
dependencies {
    gametestImplementation sourceSets.client.output
    gametestImplementation rootProject.project(':menukit').sourceSets.client.output
    gametestImplementation rootProject.project(':slotkit').sourceSets.client.output
    // For the scene client too: ORG_GRADLE_PROJECT_withTotem=1 test-gallery/run-scene.sh ...
    if (project.hasProperty('withTotem')) {
        evaluationDependsOn(':simple-totem-slot')
        def totemJar = files(rootProject.project(':simple-totem-slot').tasks.named('jar'))
        gametestRuntimeOnly totemJar
        clientRuntimeOnly totemJar
    }
}

jar {
    from('LICENSE') { rename { "${it}_${project.name}" } }
}

// Stamp the real project version into fabric.mod.json at build. The manifest
// declares "version": "${version}", because a hardcoded manifest version
// silently breaks every dependency gate against this mod.
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

// ── Modrinth Publishing ────────────────────────────────────────────────
// Simple Elytra Slot (slug simple-elytra-slot).
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = ""   // set once the Modrinth project exists
    versionNumber = property('simpleelytraslot_version')
    versionName = "Simple Elytra Slot ${property('simpleelytraslot_version')}"
    versionType = "release"
    // The player-facing changelog lives in changelog.md, one entry, overwritten each
    // release (git keeps the history).
    changelog = file('changelog.md').text
    // The README is the public description; `modrinthSyncBody` pushes it.
    syncBodyFrom = file('README.md').text
    // 26.x: no remap step, `jar` IS the shippable artifact.
    uploadFile = jar
    gameVersions = [property('minecraft_version')]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
        required.project "menukit"
        required.project "slotkit"
        optional.project "inventory-plus"
    }
}

// The shipped jar must self-report the bumped version. A jar that
// says the wrong version silently breaks every dependency gate against it, so this
// fails the build instead of relying on someone remembering to unzip and look.
tasks.register('verifyJarVersion') {
    dependsOn 'jar'
    doLast {
        def jar = tasks.named('jar').get().archiveFile.get().asFile
        def modJson = zipTree(jar).matching { include 'fabric.mod.json' }.singleFile
        def stamped = new groovy.json.JsonSlurper().parse(modJson).version
        if (stamped != project.version.toString()) {
            throw new GradleException("${jar.name}: fabric.mod.json says ${stamped}, expected ${project.version}")
        }
        println "verifyJarVersion: ${jar.name} reports ${stamped}"
    }
}
build.dependsOn verifyJarVersion

// This mod must pin each Kit to the major it was built against.
// The floor guarantees every Kit call it makes exists at load time; the ceiling stops a
// future breaking major from loading against code that never saw it. Both halves matter:
// a floor alone lets a new major rename an API out from under a shipped jar, and the
// player gets a NoSuchMethodError hours into a session instead of a refusal at launch.
// Commas are rejected outright: Fabric parses ">=5.0.0,<6.0.0" without complaint and the
// resulting predicate then matches NO version at all, which silently disables the mod.
tasks.register('verifyKitRanges') {
    def src = file('src/main/resources/fabric.mod.json')
    // Each Kit id in `depends`, checked against its own version property. MenuKit and
    // SlotKit each keep their own version; neither re-versions the other.
    def kits = [menukit: 'menukit_version', slotkit: 'slotkit_version']
    def versions = kits.collectEntries { id, prop -> [(id): (project.findProperty(prop) ?: '').toString()] }
    inputs.file src
    inputs.property 'kit_versions', versions
    doLast {
        def depends = new groovy.json.JsonSlurper().parse(src).depends ?: [:]
        if (depends['menukit-containers'] != null) {
            throw new GradleException(
                "fabric.mod.json: depends on 'menukit-containers'. Containers is SlotKit now: " +
                "depend on 'slotkit' instead.")
        }
        kits.each { id, prop ->
            def declared = depends[id]?.toString()
            if (declared == null) return
            def version = versions[id]
            if (!version) throw new GradleException("verifyKitRanges: '${id}' is declared but ${prop} is not set")
            if (declared.contains(',')) {
                throw new GradleException(
                    "fabric.mod.json: '${id}' is '${declared}'. Fabric accepts a comma here and the " +
                    "predicate then matches no version at all. Separate the bounds with a space.")
            }
            // Floor at major.minor, not just major: a minor can add API that a consumer
            // built against it calls, and flooring at the major alone would let that jar
            // load on an older minor and die with NoSuchMethodError.
            def parts = version.replaceAll(/\+.*$/, '').tokenize('.')
            def major = Integer.parseInt(parts[0])
            def minor = Integer.parseInt(parts[1])
            def expected = ">=${major}.${minor}.0 <${major + 1}.0.0".toString()
            if (declared != expected) {
                throw new GradleException(
                    "fabric.mod.json: '${id}' is '${declared}', expected '${expected}'. This mod is " +
                    "built against ${id} ${version}, so it floors at that major.minor and stops " +
                    "below the next major.")
            }
            println "verifyKitRanges: ${id} '${expected}' (built against ${version})"
        }
    }
}
build.dependsOn verifyKitRanges
